services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chiketto
      POSTGRES_PASSWORD: chiketto
      POSTGRES_DB: chiketto
    ports: ["5434:5432"] # 5434 di host: 5432 sudah dipakai PostgreSQL lokal
    volumes: [pgdata:/var/lib/postgresql/data, ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chiketto"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

volumes:
  pgdata:
